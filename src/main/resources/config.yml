selection:
  refresh-chances: 3
  countdown-seconds: 5
  # 첫 실행 후에는 설정 UI에서 아이템을 직접 넣고 빼서 변경할 수 있습니다.
  # starting-items: []
  # class-weapon: {} # 비워 두면 클래스별 고유 기본 무기를 지급합니다.

# true이면 Minecraft 기본(바닐라) 클라이언트만 접속할 수 있습니다.
client-restrictions:
  vanilla-only: false

skills:
  # 2.0이면 모든 스킬의 재사용 대기시간이 2배 빠르게 흘러 실제 대기시간이 절반이 됩니다.
  cooldown-flow-multiplier: 1.0

# 경기 시작 화면에서 아래 규칙들을 토글로 조합합니다.
modes:
  team:
    # 팀 모드의 팀당 인원입니다. 전체 참가자가 이 수로 정확히 나뉘어야 시작됩니다.
    players-per-team: 2
  cooperative:
    # 공동 모드의 조당 인원입니다. 팀+공동에서는 한 팀 안에서 조를 만듭니다.
    players-per-group: 2
    # true이면 매 경기 역할 순서를 섞고, false이면 fixed-roles 순서를 반복합니다.
    random-role-assignment: true
    fixed-roles:
      - movement-combat
      - hotbar-skills

# 성장 모드: 맵에 따라 지역 생성 및 시작이 실패할 수 있습니다. 모든 설정은 경기 시작 시 고정됩니다.
growth:
  population-revision: 1
  regions:
    maximum: 16
    minimum: 4
    attempts: 12
  # 낮과 밤 각각의 길이입니다. 경고 지역은 다음 낮/밤 전환에 금지됩니다.
  period-seconds: 120
  warnings-per-period: 1
  forbidden-damage: 2.0
  final-shrink-seconds: 120
  level:
    maximum: 30
    points: 3
    health: 2.0
    experience-base: 60
    experience-step: 25
    player-experience: 100
  mobs:
    # 성장 몬스터/동물의 이름 위에 현재 체력과 최대 체력을 표시합니다.
    show-health: true
    # 몬스터와 동물 합계입니다. 기본 12마리 중 동물 6마리, 몬스터 6마리입니다.
    per-region: 12
    maximum: 192
    experience: 30
  items:
    drop-chance: 0.45
  events-enabled: true
  # 예정 위치/시간을 지도에 미리 표시하고, 등장하면 금색 이름과 빨간 X로 강조합니다.
  # 획득/처치/만료/금지 시 마커도 제거됩니다. 예정 위치가 막히면 이동하지 않고 해당 등장을 생략합니다.
  # 이벤트에 mob-type: SKELETON을 추가하면 아이템 대신 한정 몬스터가 등장하고 처치자에게 reward를 지급합니다.
  # 지원: ZOMBIE, SKELETON, SPIDER, HUSK, STRAY, DROWNED, WITHER_SKELETON. 미지정 시 기존 아이템 이벤트입니다.
  events:
    ancient-grove:
      day: 2
      night: false
      terrain-tags: [forest, plains]
      reward: world-tree
      lifetime-seconds: 90
    midnight-relic:
      day: 3
      night: true
      terrain-tags: []
      reward: moon-heart
      lifetime-seconds: 90
  # 클래스 ID별 선택 설정. 미설정 클래스도 직업 유형에 따른 기본 계수가 적용됩니다.
  # 주*1.5% + 부*0.6%에 공격 성향별 basic-damage-weight / skill-damage-weight를 곱합니다. 피해 상한은 없습니다.
  # 쿨다운은 기본 지능에만 반응합니다. effects.cooldown: {stat: INTELLIGENCE, percent: 0.5}로 별도 지정할 수 있습니다.
  # example: {primary: STRENGTH, secondary: AGILITY, primary-percent: 1.5, secondary-percent: 0.6, basic-damage-weight: 1.4, skill-damage-weight: 0.65}
  classes: {}

# 모든 값은 현재 클래스 수치를 기준으로 한 배율입니다. 개별 클래스 항목은 첫 실행 때 자동 생성됩니다.
class-balance:
  defaults:
    overall-multiplier: 1.0
    damage-multiplier: 1.0
    healing-multiplier: 1.0
    range-multiplier: 1.0
    status-duration-multiplier: 1.0
    status-power-multiplier: 1.0
    cooldown-flow-multiplier: 1.0
  classes: {}

# GitHub의 최신 정식 릴리스를 확인하고 다음 서버 재시작 때 적용할 JAR을 준비합니다.
# 릴리스 태그와 JAR 내부 plugin.yml의 version은 같은 버전이어야 합니다. (예: v1.0.2 / 1.0.2)
auto-update:
  enabled: true
  repository: BEOBMA/ClassWarPlugin
  # sources/javadoc JAR은 자동으로 제외됩니다. 여러 실행 JAR이 일치하면 -all/-shadow JAR을 우선합니다.
  asset-pattern: '(?i)^ClassWarPlugin(?:-[0-9A-Za-z._-]+)?\.jar$'
  startup-delay-seconds: 10
  check-interval-hours: 6
  max-download-size-mib: 64

rank-chances:
  # 전체 가중치 합계 1000 기준 Special의 기본 등장 확률은 0.1%입니다.
  special: 1
  l: 40
  s: 101
  a: 202
  b: 303
  c: 353

display:
  # false이면 관전 모드에서 플레이어 선택 및 관전에 문제가 생길 수 있습니다.
  player-list-visible: false
  # 경기 중 화면의 로케이터 바에 플레이어 위치를 표시합니다.
  locator-bar-enabled: false

combat:
  # 참가자마다 주어지는 추가 목숨입니다. 0이면 첫 사망에 바로 탈락합니다.
  player-lives: 1
  elimination-rewards:
    # 플레이어 처치 시 BREAK/TERMINATE 타이틀과 체력 회복을 적용합니다.
    enabled: false
  damage-indicators:
    enabled: true
  death-messages:
    enabled: true
    show-killer: true
    show-cause: true
  # 전체 배율과 세부 배율이 곱해져 최종 배율이 됩니다. 0.0으로 설정하면 해당 피해를 받지 않습니다.
  damage-multipliers:
    overall: 1.0
    basic-attack: 1.0
    ranged-attack: 1.0
    skill: 1.0
    status-effect: 1.0
    fall: 1.0
    drowning: 1.0
    fire: 1.0
    lava: 1.0
    suffocation: 1.0
    explosion: 1.0
    poison-magic: 1.0
    starvation: 1.0
    void: 1.0
    freezing: 1.0
    contact: 1.0
    lightning: 1.0
    mob-attack: 1.0
    impact: 1.0
    world-border: 1.0
    other-environment: 1.0

map:
  center-x: 704.5
  center-z: -615.5

scatter:
  minimum-radius: 45.0
  maximum-radius: 140.0
  minimum-player-distance: 24.0
  # 활성화하면 산개 대신 모든 참가자를 아래 한 좌표에 스폰합니다.
  fixed-spawn:
    enabled: false
    world: ""
    x: 0.0
    y: 64.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

border:
  enabled: true
  initial-size: 320.0
  random-center:
    minimum-distance: 0.0
    maximum-distance: 140.0
  delay-seconds: 300
  shrink-seconds: 600
  minimum-size: 40.0
  damage-buffer: 5.0
  # 일반 월드보더 밖에서 블록당 받는 피해입니다. 마인크래프트 기본값은 0.2입니다.
  damage-per-block: 0.2
  final-descent-seconds: 180
  # 상공에서 내려오는 최종 자기장에 닿았을 때 받는 고정 피해와 피해 주기입니다.
  final-damage: 2.0
  final-damage-interval-seconds: 1.0

# 내부 개발용 기능입니다. 실서버에서는 활성화하지 마세요.
internal:
  testing:
    commands-enabled: false
